[package]
name = "codex-prompt-history"
version = "0.12.0"
edition = "2024"
description = "A terminal browser for Codex prompt history"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = { version = "0.29", features = ["osc52"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
