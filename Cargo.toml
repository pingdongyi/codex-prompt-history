[package]
name = "codex-prompt-history"
version = "0.8.0"
edition = "2024"
description = "A terminal browser for Codex prompt history"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"

[profile.release]
strip = true
lto = "thin"
