name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cross-compilers and Rust targets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools gcc-mingw-w64-x86-64-posix
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Validate source and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build release packages
        run: bash scripts/release.sh
      - name: Verify Linux binary and checksums
        run: |
          HISTORY_BINARY=target/x86_64-unknown-linux-musl/release/codex-prompt-history python3 tests/session_smoke.py
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Codex Prompt History $RELEASE_TAG" --notes-file RELEASE_NOTES.md
